[package]
name = "tauri-plugin-officina-documents"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-officina-documents"
description = "User-mediated document export and printing for Officina"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2.11", features = ["webview-data-url"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
ammonia = "4.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
