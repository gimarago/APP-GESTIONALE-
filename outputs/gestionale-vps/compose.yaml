name: officina

services:
  app:
    # A fixed name deliberately prevents Compose scaling this stateful service.
    container_name: officina-app
    build:
      context: .
      dockerfile: Dockerfile
    image: officina-app:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_DIR: /data
      OFFICINA_ORIGIN: ${OFFICINA_ORIGIN:?Set OFFICINA_ORIGIN in .env}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      RECOVERY_SMTP_HOST: ${RECOVERY_SMTP_HOST:-}
      RECOVERY_SMTP_PORT: ${RECOVERY_SMTP_PORT:-}
      RECOVERY_SMTP_USER: ${RECOVERY_SMTP_USER:-}
      RECOVERY_SMTP_PASSWORD: ${RECOVERY_SMTP_PASSWORD:-}
      RECOVERY_SMTP_FROM: ${RECOVERY_SMTP_FROM:-}
    # No host port is published. Caddy is the only public entry point.
    networks:
      - backend
      - outbound
    volumes:
      - officina_data:/data
      - officina_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      OFFICINA_DOMAIN: ${OFFICINA_DOMAIN:?Set OFFICINA_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    networks:
      - frontend
      - backend
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pec:
    profiles: ["pec"]
    image: officina-app:local
    container_name: officina-pec
    init: true
    command: ["node", "server/pec-worker.mjs"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      OFFICINA_PYTHON: python3
      PEC_HOST: ${PEC_HOST:-mbox.cert.legalmail.it}
      PEC_PORT: "${PEC_PORT:-993}"
      PEC_MAILBOX: ${PEC_MAILBOX:-INBOX}
      PEC_USER: ${PEC_USER:-}
      PEC_APP_PASSWORD: ${PEC_APP_PASSWORD:-}
      SHOP_VAT: ${SHOP_VAT:-}
    networks:
      - outbound
    volumes:
      - officina_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frontend:
  backend:
    internal: true
  # Provides egress for SMTP/IMAP; neither service publishes a host port here.
  outbound:

volumes:
  officina_data:
  officina_backups:
  caddy_data:
  caddy_config:
